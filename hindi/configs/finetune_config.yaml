# Reasoning-finetune config for Model H (Hindi).
# max_steps=1000, batch_size=32 -> 32,000 example-draws over a 6,000-example
# train set (~5.3 effective epochs, with replacement -- same random-sampling
# philosophy as pretraining, chosen so checkpoint-resume needs nothing but
# the step counter, and consistent with how Phase 2 already justified it).
batch_size: 32
max_steps: 1000
warmup_steps: 50
lr: 0.00002               # ~15x lower than pretraining's 3e-4 -- see trainer.py docstring
min_lr_ratio: 0.1
weight_decay: 0.1
grad_clip: 1.0
eval_interval: 100
eval_iters: 20
save_interval: 100
log_interval: 20
seed: 42
amp: true
max_len: 96                # covers p99 tokenized (prompt+answer+eos) length with margin
out_dir: finetune_checkpoints   # override with --out_dir, e.g. a mounted Drive path
data_dir: data/reasoning        # overridden automatically by hindi/finetune/finetune.py
pretrained_ckpt: ""             # required: set via --pretrained_ckpt (Phase 2's best.pt)

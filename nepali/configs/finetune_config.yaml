# Reasoning-finetune config for Model L (Nepali). Identical hyperparameters
# to Hindi's finetune_config.yaml -- keeping them equal, same as Phase 2's
# pretraining hyperparameters, means any pretrained-vs-finetuned or H-vs-L
# difference in the results can be attributed to the data/language, not to
# a confounding hyperparameter difference.
batch_size: 32
max_steps: 1000
warmup_steps: 50
lr: 0.00002
min_lr_ratio: 0.1
weight_decay: 0.1
grad_clip: 1.0
eval_interval: 100
eval_iters: 20
save_interval: 100
log_interval: 20
seed: 42
amp: true
max_len: 96
out_dir: finetune_checkpoints
data_dir: data/reasoning
pretrained_ckpt: ""
